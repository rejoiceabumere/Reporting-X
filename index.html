<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>X Report Helper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <section class="card">

        <div class="logo">𝕏</div>

        <h1>X Report Helper</h1>

        <p class="subtitle">
            Enter an X username or profile link to begin.
        </p>

        <!-- ONLY INPUT ON MAIN SCREEN -->

        <label for="account">
            X username or profile link
        </label>

        <input
            type="text"
            id="account"
            placeholder="@username or https://x.com/username"
            autocomplete="off"
        >

        <button onclick="startReport()">
            Continue
        </button>

        <p id="message"></p>


        <!-- STEP 2 -->

        <div id="stepTwo" class="hidden">

            <div class="account-preview">

                <span>Account</span>

                <strong id="accountName"></strong>

            </div>


            <label for="reason">
                Genuine report reason
            </label>

            <select id="reason">

                <option value="">
                    Select a reason
                </option>

                <option>
                    Harassment or abusive behavior
                </option>

                <option>
                    Hateful conduct
                </option>

                <option>
                    Spam or platform manipulation
                </option>

                <option>
                    Impersonation
                </option>

                <option>
                    Violent threats
                </option>

                <option>
                    Other violation
                </option>

            </select>


            <label for="evidence">
                Evidence / post links
            </label>

            <textarea
                id="evidence"
                placeholder="Paste relevant post links, one per line..."
            ></textarea>


            <label for="description">
                Additional information
            </label>

            <textarea
                id="description"
                placeholder="Briefly describe the genuine violation..."
            ></textarea>


            <button onclick="generatePackage()">
                Generate Report Package
            </button>


            <div id="package"></div>

        </div>


        <div class="notice">

            <strong>Important</strong>

            <p>
                Only provide truthful information about genuine
                violations. X reviews reports and decides whether
                enforcement is appropriate.
            </p>

        </div>

    </section>

</main>


<script>

let currentAccount = "";


/* -------------------------
   VALIDATE ACCOUNT
------------------------- */

function getUsername(value) {

    value = value.trim();

    if (!value) {
        return null;
    }


    value = value.replace(/\s+/g, "");


    /* Profile URL */

    if (
        value.includes("x.com/") ||
        value.includes("twitter.com/")
    ) {

        try {

            const url = new URL(
                value.startsWith("http")
                    ? value
                    : "https://" + value
            );

            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);


            if (parts.length === 0) {
                return null;
            }


            const username =
                parts[0].replace("@", "");


            if (
                /^[A-Za-z0-9_]{1,15}$/.test(username)
            ) {

                return "@" + username;

            }

        } catch {

            return null;

        }

    }


    /* Username */

    value = value.replace("@", "");


    if (
        /^[A-Za-z0-9_]{1,15}$/.test(value)
    ) {

        return "@" + value;

    }


    return null;
}


/* -------------------------
   STEP 1
------------------------- */

function startReport() {

    const input =
        document.getElementById("account");

    const message =
        document.getElementById("message");

    const stepTwo =
        document.getElementById("stepTwo");


    const username =
        getUsername(input.value);


    if (!username) {

        message.textContent =
            "Please enter a valid X username or profile link.";

        return;

    }


    currentAccount =
        username;


    document.getElementById(
        "accountName"
    ).textContent =
        username;


    message.textContent = "";


    stepTwo.classList.remove("hidden");


    stepTwo.scrollIntoView({
        behavior: "smooth"
    });

}


/* -------------------------
   GENERATE PACKAGE
------------------------- */

function generatePackage() {

    const reason =
        document.getElementById("reason").value;

    const evidence =
        document.getElementById("evidence").value
            .split("\n")
            .map(x => x.trim())
            .filter(Boolean);

    const description =
        document.getElementById("description").value.trim();

    const output =
        document.getElementById("package");


    if (!reason) {

        output.innerHTML =
            "<p class='error'>Please select a genuine report reason.</p>";

        return;

    }


    const profile =
        "https://x.com/" +
        currentAccount.substring(1);


    output.innerHTML = `

        <div class="report-box">

            <h2>Report Package</h2>

            <p>
                <strong>Account:</strong>
                ${escapeHTML(currentAccount)}
            </p>

            <p>
                <strong>Profile:</strong><br>

                <a
                    href="${profile}"
                    target="_blank"
                    rel="noopener"
                >
                    ${profile}
                </a>
            </p>

            <p>
                <strong>Reason:</strong>
                ${escapeHTML(reason)}
            </p>

            <p>
                <strong>Evidence:</strong>
            </p>

            ${
                evidence.length
                ? "<ul>" +
                    evidence.map(
                        x => "<li>" +
                        escapeHTML(x) +
                        "</li>"
                    ).join("") +
                  "</ul>"
                : "<p>No evidence links provided.</p>"
            }

            <p>
                <strong>Additional information:</strong>
            </p>

            <p class="description">
                ${
                    description
                    ? escapeHTML(description)
                    : "None provided."
                }
            </p>


            <button
                onclick="downloadPackage()"
            >
                Download Package
            </button>


            <button
                class="secondary"
                onclick="openX()"
            >
                Open X Profile
            </button>

        </div>

    `;

}


/* -------------------------
   DOWNLOAD
------------------------- */

function downloadPackage() {

    const reason =
        document.getElementById("reason").value;

    const evidence =
        document.getElementById("evidence").value;

    const description =
        document.getElementById("description").value;


    const text =

`X REPORT PACKAGE

Account:
${currentAccount}

Profile:
https://x.com/${currentAccount.substring(1)}

Reason:
${reason}

Evidence:
${evidence || "None provided."}

Additional information:
${description || "None provided."}

Prepared for review and submission through X's
official reporting process.
`;


    const blob =
        new Blob(
            [text],
            { type: "text/plain" }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        currentAccount.substring(1) +
        "-report.txt";


    link.click();


    URL.revokeObjectURL(url);

}


/* -------------------------
   OPEN X
------------------------- */

function openX() {

    window.open(
        "https://x.com/" +
        currentAccount.substring(1),
        "_blank"
    );

}


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
